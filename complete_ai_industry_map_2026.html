        function renderContent() {
            const mainContent = document.getElementById('mainContent');
            const mainGrid = document.createElement('div');
            mainGrid.className = 'main-grid';
            
            const sections = {
                '🧠 CORE CONCEPTS': Object.entries(knowledgeBase).filter(([_, v]) => v.category === 'core'),
                '🤖 LLM MODELS (2026)': Object.entries(knowledgeBase).filter(([_, v]) => v.category === 'model'),
                '🛠️ TOOLS & PLATFORMS': Object.entries(knowledgeBase).filter(([_, v]) => v.category === 'tool'),
                '🎯 FRAMEWORKS': Object.entries(knowledgeBase).filter(([_, v]) => v.category === 'framework'),
                '🔍 RAG & KNOWLEDGE': Object.entries(knowledgeBase).filter(([_, v]) => v.category === 'database'),
                '⚡ REAL-TIME SYSTEMS': Object.entries(knowledgeBase).filter(([_, v]) => v.category === 'realtime'),
                '🏢 APPLICATIONS': Object.entries(knowledgeBase).filter(([_, v]) => v.category === 'application'),
                '🔥 TRENDS 2026': Object.entries(knowledgeBase).filter(([_, v]) => v.category === 'trend'),
                '🏭 ENTERPRISE': Object.entries(knowledgeBase).filter(([_, v]) => v.category === 'enterprise'),
                '🔒 SECURITY': Object.entries(knowledgeBase).filter(([_, v]) => v.category === 'security')
            };
            
            let sectionHTML = '';
            for (const [sectionName, items] of Object.entries(sections)) {
                if (items.length === 0) continue;
                
                sectionHTML += `<div class="section">
                    <div class="section-title">${sectionName}</div>
                    <div class="node-list">`;
                
                items.forEach(([nodeName, nodeData]) => {
                    sectionHTML += `<div class="node ${nodeData.category}" onclick="showDetails('${nodeName}')">${nodeName}</div>`;
                });
                
                sectionHTML += `</div></div>`;
            }
            
            sectionHTML += `<div class="details-panel empty" id="detailsPanel" style="grid-column: 1/-1;">
                <div>⚡ CLICK_NODE_FOR_DETAILS ⚡</div>
            </div>`;
            
            mainContent.innerHTML = sectionHTML;
        }
        
        function showDetails(nodeName) {
            const panel = document.getElementById('detailsPanel');
            const nodeData = knowledgeBase[nodeName];
            
            if (!nodeData) return;
            
            let html = `<div class="detail-title">→ ${nodeName}</div>`;
            
            if (nodeData.tags) {
                html += `<div style="margin-bottom: 12px;">`;
                nodeData.tags.forEach(tag => {
                    html += `<span class="tag ${tag === 'Critical' ? 'critical' : ''}">${tag}</span>`;
                });
                html += `</div>`;
            }
            
            html += `<div class="detail-content">${nodeData.description}</div>`;
            html += `<div class="detail-category">📋 DETAILS</div>
                    <div class="detail-content">${nodeData.details}</div>`;
            
            html += `<div class="detail-category">🔗 EXPLORE RELATED</div><div class="related-items">`;
            
            const allNodeNames = Object.keys(knowledgeBase);
            allNodeNames.slice(0, 6).forEach(name => {
                if (name !== nodeName) {
                    html += `<div class="related-item" onclick="showDetails('${name}')">${name}</div>`;
                }
            });
            html += `</div>`;
            
            panel.className = 'details-panel';
            panel.innerHTML = html;
            panel.scrollIntoView({ behavior: 'smooth' });
        }
        
        document.getElementById('searchBox').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const nodes = document.querySelectorAll('.node');
            nodes.forEach(node => {
                node.style.display = (query === '' || node.textContent.toLowerCase().includes(query)) ? 'inline-block' : 'none';
            });
        });
        
        function filterByCategory(category) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            const nodes = document.querySelectorAll('.node');
            nodes.forEach(node => {
                node.style.display = (category === '' || node.classList.contains(category)) ? 'inline-block' : 'none';
            });
        }
        
        function switchTab(tab) {
            document.querySelectorAll('.content-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById('content' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add('active');
            event.target.classList.add('active');
            
            if (tab !== 'all' && !document.getElementById('content' + tab.charAt(0).toUpperCase() + tab.slice(1)).innerHTML.includes('section')) {
                renderTabContent(tab);
            }
        }
        
        function renderTabContent(tab) {
            const contentId = 'content' + tab.charAt(0).toUpperCase() + tab.slice(1);
            const container = document.getElementById(contentId);
            const categoryMap = {
                'applications': 'application',
                'realtime': 'realtime',
                'trends': 'trend',
                'enterprise': 'enterprise'
            };
            
            const items = Object.entries(knowledgeBase).filter(([_, v]) => v.category === categoryMap[tab]);
            let html = '';
            
            items.forEach(([nodeName, nodeData]) => {
                html += `<div class="section">
                    <div class="section-title">${nodeName}</div>
                    <div class="detail-content">${nodeData.description}</div>
                    <div style="margin-top: 10px;">`;
                if (nodeData.tags) {
                    nodeData.tags.forEach(tag => {
                        html += `<span class="tag">${tag}</span>`;
                    });
                }
                html += `</div></div>`;
            });
            
            container.innerHTML = html;
        }
        
        window.addEventListener('load', renderContent);
    </script>
